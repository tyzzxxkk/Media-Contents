<!-- 1101 기태연 inline block-->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a {
            background-color:  blue;
        }
        span {
            background-color: blueviolet;
        }
        div, p, h1 {
            background-color: brown;
        }
    </style>
</head>
<body>
    <h1>이 문장은 <span>span 태그</span>입니다.</h1>
    <h1>이 문장은 <div>div 태그</div>입니다.</h1>
    <h1>이 문장은 <a>a 태그</a>입니다.</h1>
    <p>이 문장은 p 태그입니다.</p>
</body>
</html>
