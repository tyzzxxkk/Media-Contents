<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드롭 다운 매뉴</title>
    <style>
        .dropdown button {
            background-color:hsl(0, 0%, 80%);
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }
        .dropdown a {
            display: block;
            color: black;
            text-decoration: none;
            padding: 10px 15px;
        }
        .dropdown content {
            display: none;
            background-color: hsl(0, 0%, 95%);
            min-width: 100px;
            box-shadow: 2px 2px 5px hsla(0, 0%, 0%, 0.8);
            position: absolute;
        }
        .dropdown:hover .content {
            background-color: hsl(0, 0%, 70%);
        }
        .dropdown a:hover {
            background-color: hsl(0, 0%, 90%);
        }
    </style>
</head>
<body>
    <div class="dropdown">
        <div class="content">
            <button>급식 메뉴</button>
            <a href="#">바질크림떡볶이</a>
            <a href="#">오뎅국</a>
            <a href="#">닭도리탕</a>
        </div>
    </div>
</body>
</html>
