<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시맨틱 태그_header 태그 연습</title>
    <style>
        body {
            margin: 0 auto;
        }
        header {
            display:flex;
            background-color:blueviolet;
            justify-content: space-between;
            padding:20px 10%;
            align-items: center;
        }
        header > nav > ul {
            display: flex;
            gap:20px;
        }
        header > nav > ul > li {
            list-style: none;
        }
        header > nav > ul > li > a {
            text-decoration: none;
            color:white;
        }
        header > nav > ul > li > a:hover {
            font-weight: bolder;
            color: yellow;
        }
        header > h1 {
            color:white;
            font-style: oblique;
        }
    </style>
</head>
<body>
    <header>
        <h1>Taeyeon company</h1> <!--로고(이미지) 자리-->
        <nav>
            <ul>
                <li><a href="">회사 소개</a></li>
                <li><a href="">제품 소개</a></li>
                <li><a href="">고객 지원</a></li>
            </ul>
            <form>
                <input type="search">
                <input type="submit">
            </form>
        </nav>
    </header>
</body>
</html>
