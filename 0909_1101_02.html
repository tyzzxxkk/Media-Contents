<!-- 1101 기태연 inline block-->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            background-color: hsl(106, 70%, 70%);
            width:150px;
            height: 150px;
            display: inline-block;
        }
        a {
            background-color: hsl(211, 70%, 70);
            width: 150px;
            height: 150px;
            display: block;
        }
    </style>
</head>
<body>
    <div>div</div>
    <a>a</a>
</body>
</html>
