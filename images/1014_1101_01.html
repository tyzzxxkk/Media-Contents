<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>intro 인트로 페이지</title>
    <style>
        @font-face {
            font-family: 'MYYeongnamnu';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/MYYeongnamnu.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        body {
            margin : 0;
            padding : 0;
        }
        .glass {
            width: 100vw;
            height: 100vh;
            background: url(images/sky.jpg) no-repeat center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pre {
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-backdrop-filter: brightness(1.1) blur(20px);
            backdrop-filter: brightness(1.1) blur(20px);
            mix-blend-mode: overlay;
            border-radius: 40%;
        }
        .pre p {
            font-size: 2.5rem;
            font-family: 'MYYeongnamnu';
            font-weight: 900;
        }
    </style>
</head>
<body>
    <div class="glass">
        <div class="pre">
            <p>나의 꿈은<br>
               바람이<br>
               되어서</p>
        </div>
    </div>
</body>
</html>
