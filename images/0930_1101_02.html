<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 페이지</title>
    <style>
        body {
            margin: 0px;
            height: 100vh;
            width: 100%;
            background-image: url(images/autumn.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .glass_effect {
            width: 700px;
            height: 400px;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 5px 10px 20px hsla(0, 0%, 0%, 0.4);
            text-align: center;
            backdrop-filter: blur(2px);
        }
        img {
            width: 230px;
        }
    </style>
</head>
<body>
    <div class="glass_effect">
        <h1>Glass Effect</h1>
        <h2>MIRIM 1학년 1반</h2>
        <img src="images/autumn.jpg">
    </div>
</body>
</html>
