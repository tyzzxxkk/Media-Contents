<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인라인 요소, 볼록 요소</title>
        <style>
         span {
            display: block;
            background-color: brown;
         }
         div {
            display: block;
            background-color: aqua;
         }
         a {
            display: block;
            background-color: blueviolet;
         }
         p {
            background-color: palevioletred;
         }
        </style>
</head>
<body>
  <h1>이 문장은 <span>span 타입</span>입니다.</h1>
  <h1>이 문장은<div>div타입</div>입니다.</h1>
  <h1>이 문장은 <a> a 타입</a>입니다.</h1>
  <p>이 문장은 p 타입입니다.</p>
