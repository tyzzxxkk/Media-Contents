<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스모델 익히기_margin, padding, border</title>
    <style>
        p.box {
            border-right-width: 20px;
            border-style: solid;
            border-right-color: blue;
            width: 150px;
            height: 50px;
            background: yellow;
            padding: 20px;
            margin-left: 100px;
        }
    </style>
</head>
<body>
    <p class "box">좋아하는 노래</p> 
</body>
</html>
