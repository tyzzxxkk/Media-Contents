<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상 요소</title>
    <style>
        h1::first-letter {
            color: red;
            font-size: 1.8em;
            font-style: italic;
        }
        p::first-letter {
            color: blue;
        }
        #fruit li::before {
            content: "✔️"
        }
        #apple li:after {
            content: "🍎";
        }
        #cherry li:after {
            content: "🍒";
        }
        #grape li:after {
            content: "🍇";
        }
    </style>
</head>
<body>
    <h1>Hello</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Iste quis, debitis fuga temporibus voluptate dolore iusto obcaecati, consectetur mollitia vero cupiditate rerum autem quibusdam quae veritatis alias? In, culpa doloribus?</p>
    <li id="apple">apple</li>
    <li id="orange">cherry</li>
    <li id="banana">grape</li>
</body>
</html>
